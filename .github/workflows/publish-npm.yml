name: Private npm Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag (required to publish; empty checks selected branch)
        type: string
        default: ''
      publish:
        description: Publish the existing tag after checks
        type: boolean
        default: false
permissions:
  contents: read
# Automatic and manual releases of the same tag share a lock; never cancel publication.
concurrency:
  group: private-npm-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.ref.outputs.commit }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable source and existing tag
        id: ref
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          tag="$MANUAL_TAG"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="${GITHUB_REF#refs/tags/}"; fi
          if [[ "$MANUAL_PUBLISH" == true && -z "$tag" ]]; then
            echo 'Publishing requires an existing release_tag' >&2; exit 1
          fi
          commit="$GITHUB_SHA"
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected stable vX.Y.Z tag' >&2; exit 1; }
            commit=$(git rev-parse --verify "refs/tags/$tag^{commit}")
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  check:
    needs: resolve
    # Download handoff cases target Windows/macOS; Linux intentionally cannot install.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # engines: ^22.19.0 || >=24; test the minimum and current supported even branches.
        node: ['22.19.0', '24', '26']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Validate package and selected tag
        run: node scripts/validate-release.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Read pinned host source
        id: upstream
        run: |
          node test/run-test-cases.mjs --upstream >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.upstream.outputs.repository }}
          ref: ${{ steps.upstream.outputs.commit }}
          path: .test-host/desktop
          persist-credentials: false
      # ENV-05 / SOURCE-04 / DL-07 read the public TokensCowork releases through the
      # GitHub API. Authenticated calls draw on 1000 requests/hour/repository instead
      # of the 60/hour anonymous bucket that every hosted runner shares by exit IP.
      - run: npm run check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack and verify runtime resources
        run: |
          mkdir -p .release
          npm pack --ignore-scripts --pack-destination .release
          node scripts/verify-tarball.mjs .release/*.tgz
  publish:
    needs: [resolve, check]
    if: >-
      github.repository == 'sobermh/tokens_DshVersionUpdates_code' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(inputs.release_tag, 'v')))
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.package.outputs.package }}
      package-check: ${{ steps.checker.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://npm.tokensapi.ai/
      - run: node scripts/validate-release.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/
      - run: npm run build
      - name: Pack and inspect
        # Tests and build already ran; npm pack supports --ignore-scripts.
        run: |
          mkdir -p .release
          npm pack --ignore-scripts --pack-destination .release
          node scripts/verify-tarball.mjs .release/*.tgz
      # 发布包检查是附加门禁：未配置只读 Secret 时跳过检查但不阻断发布；
      # 一旦配置，账号必须是 market，配错仍在发布前失败。
      - name: 检查 · 发布包检查的只读凭证
        id: checker
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PLUGIN_CHECK_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo '::notice::未配置 PLUGIN_CHECK_REGISTRY_TOKEN，跳过发布包检查'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$(npm whoami --registry=https://npm.tokensapi.ai/)" == market ]] || { echo '::error::包检查需要 market 只读账号'; exit 1; }
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Publish and verify private registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_PUBLISH_TOKEN }}
        run: |
          node scripts/registry-release.mjs check
          npm publish .release/*.tgz --ignore-scripts --registry=https://npm.tokensapi.ai/ --tag=latest
          node scripts/registry-release.mjs verify .release/*.tgz
      - name: 报告 · 输出已发布的准确版本
        id: package
        run: node -p '"package=" + require("./package.json").name + "@" + require("./package.json").version' >> "$GITHUB_OUTPUT"

  package-check:
    name: 检查 · 插件发布包
    needs: publish
    # 只在配置了只读 Secret 时运行；未配置时上一步已跳过检查并放行发布。
    if: needs.publish.outputs.package-check == 'true'
    uses: TokensAPI/tokens_DshPluginCheck_code/.github/workflows/check-plugin-package.yml@e58ceb1d238101925fe49841e5ccedd7e8eb2c10
    with:
      package: ${{ needs.publish.outputs.package }}
      checker_ref: e58ceb1d238101925fe49841e5ccedd7e8eb2c10
    secrets:
      PLUGIN_CHECK_REGISTRY_TOKEN: ${{ secrets.PLUGIN_CHECK_REGISTRY_TOKEN }}
